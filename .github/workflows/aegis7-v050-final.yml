name: Build final Aegis-7 v0.5.0 release

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, 'build-aegis7-v050-final')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aegis7-build

      - name: Reconstruct v0.5.0 source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          cat aegis7-source.tgz.b64.000 aegis7-source.tgz.b64.001 aegis7-source.tgz.b64.002 aegis7-source.tgz.b64.003 | base64 --decode > /tmp/source.tgz
          echo 'c793d2ebc9aea5b7cc500cafc69e94f81e5a11f24d9cd5d5fabd04dc09d8a11b  /tmp/source.tgz' | sha256sum -c
          tar -xzf /tmp/source.tgz
          cat v050-patch.b64.000 v050-patch.b64.001 v050-patch.b64.002 v050-patch.b64.003 | base64 --decode > /tmp/patch.tgz
          echo '6435bd8a89bbc974ec16318a8a8b95db8d332849b1ea2e8aa9a7682deeee0c16  /tmp/patch.tgz' | sha256sum -c
          tar -xzf /tmp/patch.tgz -C Aegis7_Transforming_Robot_Mod
          rm -f Aegis7_Transforming_Robot_Mod/src/client/java/com/noah/aegis7/client/input/SteamDeckGamepadInput.java
          python3 v050-generate-textures.py
          test ! -e Aegis7_Transforming_Robot_Mod/src/client/java/com/noah/aegis7/client/input/SteamDeckGamepadInput.java
          grep -q 'mod_version=0.5.0' Aegis7_Transforming_Robot_Mod/gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate and compile
        id: compile
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set -o pipefail
          { python verify-project.py; gradle clean build --stacktrace --warning-mode all; } 2>&1 | tee ../v050-final-build.log

      - name: Inspect remapped JAR
        id: inspect
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/aegis7-0.5.0.jar
          test -s "$JAR"
          for entry in fabric.mod.json com/noah/aegis7/Aegis7Mod.class com/noah/aegis7/Aegis7Client.class com/noah/aegis7/client/gui/AegisRadialScreen.class com/noah/aegis7/client/model/AegisModel.class com/noah/aegis7/state/RobotChassis.class assets/aegis7/textures/entity/stratos.png assets/aegis7/textures/entity/wraith.png assets/aegis7/textures/entity/vanguard.png; do jar tf "$JAR" | grep -Fx "$entry"; done
          ! jar tf "$JAR" | grep -q SteamDeckGamepadInput.class
          unzip -p "$JAR" fabric.mod.json | grep -F '"version": "0.5.0"'
          cp "$JAR" ../Aegis-7-Fabric-1.21.1-v0.5.0.jar
          sha256sum ../Aegis-7-Fabric-1.21.1-v0.5.0.jar > ../Aegis-7-Fabric-1.21.1-v0.5.0.jar.sha256

      - name: Client startup smoke test
        id: client
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          timeout 180s xvfb-run -a gradle runClient --console=plain > ../v050-final-client.log 2>&1
          status=$?
          set -e
          log=run/logs/latest.log
          test -f "$log"
          if grep -Eqi 'Mixin apply for mod aegis7 failed|MixinApplyError.*aegis7|Could not execute entrypoint.*aegis7|Exception in thread "Render thread"|Minecraft has crashed|NoClassDefFoundError.*aegis7' "$log"; then tail -n 250 "$log"; exit 1; fi
          grep -F 'Aegis-7 systems online.' "$log"
          grep -E 'Sound engine started|minecraft:textures/atlas' "$log"
          [[ "$status" == 0 || "$status" == 124 ]]

      - name: Server startup smoke test
        id: server
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set +e
          mkdir -p run && printf 'eula=true\n' > run/eula.txt
          timeout 120s gradle runServer --console=plain > ../v050-final-server.log 2>&1
          status=$?
          set -e
          log=run/logs/latest.log
          test -f "$log"
          if grep -Eqi 'Could not execute entrypoint.*aegis7|Minecraft has crashed|Exception in thread "Server thread"|NoClassDefFoundError.*aegis7' "$log"; then tail -n 200 "$log"; exit 1; fi
          grep -F 'Aegis-7 systems online.' "$log"
          grep -E 'Done \([0-9.]+s\)!|For help, type "help"' "$log"
          [[ "$status" == 0 || "$status" == 124 ]]

      - name: Publish result
        if: always()
        shell: bash
        env:
          C: ${{ steps.compile.outcome }}
          I: ${{ steps.inspect.outcome }}
          CL: ${{ steps.client.outcome }}
          S: ${{ steps.server.outcome }}
        run: |
          set -euo pipefail
          rm -rf release-v050-final && mkdir release-v050-final
          echo "$GITHUB_RUN_ID" > release-v050-final/RUN_ID.txt
          if [[ "$C" == success && "$I" == success && "$CL" == success && "$S" == success ]]; then
            cp Aegis-7-Fabric-1.21.1-v0.5.0.jar* release-v050-final/
            echo 'Aegis-7 v0.5.0 passed source and resource validation, Java 21/Fabric compilation and remapping, production-JAR inspection, client resource startup, and dedicated-server startup. The legacy direct Steam Deck controller poller is absent.' > release-v050-final/BUILD_PASSED.txt
          else
            printf 'Compile: %s\nInspect: %s\nClient: %s\nServer: %s\n' "$C" "$I" "$CL" "$S" > release-v050-final/BUILD_FAILED.txt
            for f in v050-final-build.log v050-final-client.log v050-final-server.log; do [[ -f "$f" ]] && { echo "--- $f ---" >> release-v050-final/BUILD_FAILED.txt; tail -n 350 "$f" >> release-v050-final/BUILD_FAILED.txt; }; done
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A release-v050-final
          git diff --cached --quiet || { git commit -m 'Publish final Aegis-7 v0.5.0 result'; git push origin HEAD:aegis7-build; }

      - uses: actions/upload-artifact@v4
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success' && steps.client.outcome == 'success' && steps.server.outcome == 'success'
        with:
          name: Aegis-7-Fabric-1.21.1-v0.5.0-final
          path: |
            Aegis-7-Fabric-1.21.1-v0.5.0.jar
            Aegis-7-Fabric-1.21.1-v0.5.0.jar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Enforce release gates
        if: steps.compile.outcome != 'success' || steps.inspect.outcome != 'success' || steps.client.outcome != 'success' || steps.server.outcome != 'success'
        run: exit 1
