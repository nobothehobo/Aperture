name: Build Aegis-7 v0.5.0 controller overhaul

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, 'build-aegis7-v050')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out isolated Aegis source branch
        uses: actions/checkout@v4
        with:
          ref: aegis7-build

      - name: Reconstruct source and apply v0.5.0 overhaul
        shell: bash
        run: |
          set -euo pipefail
          cat aegis7-source.tgz.b64.000 aegis7-source.tgz.b64.001 aegis7-source.tgz.b64.002 aegis7-source.tgz.b64.003 | base64 --decode > /tmp/aegis7-source.tgz
          echo "c793d2ebc9aea5b7cc500cafc69e94f81e5a11f24d9cd5d5fabd04dc09d8a11b  /tmp/aegis7-source.tgz" | sha256sum --check
          tar -xzf /tmp/aegis7-source.tgz
          ROOT=Aegis7_Transforming_Robot_Mod

          cat v050-patch.b64.000 v050-patch.b64.001 v050-patch.b64.002 v050-patch.b64.003 | base64 --decode > /tmp/aegis7-v050-patch.tgz
          echo "6435bd8a89bbc974ec16318a8a8b95db8d332849b1ea2e8aa9a7682deeee0c16  /tmp/aegis7-v050-patch.tgz" | sha256sum --check
          tar -xzf /tmp/aegis7-v050-patch.tgz -C "$ROOT"
          rm -f "$ROOT/src/client/java/com/noah/aegis7/client/input/SteamDeckGamepadInput.java"

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('Aegis7_Transforming_Robot_Mod/src/main/resources/assets/aegis7/textures')
          (root / 'entity').mkdir(parents=True, exist_ok=True)
          (root / 'item').mkdir(parents=True, exist_ok=True)

          variants = {
              'stratos': ((77, 96, 112), (35, 205, 240), (185, 205, 218)),
              'wraith': ((54, 55, 65), (212, 50, 75), (164, 171, 184)),
              'vanguard': ((62, 75, 72), (255, 154, 42), (192, 202, 194)),
          }

          def entity_texture(name, base, glow, metal):
              im = Image.new('RGBA', (256, 256), (*base, 255))
              d = ImageDraw.Draw(im)
              for y in range(0, 256, 16):
                  for x in range(0, 256, 16):
                      shade = ((x // 16 + y // 16) % 4) * 7 - 10
                      fill = tuple(max(0, min(255, c + shade)) for c in base) + (255,)
                      d.rectangle((x, y, x + 15, y + 15), fill=fill)
                      d.line((x, y, x + 15, y), fill=(*metal, 255), width=1)
                      d.line((x, y, x, y + 15), fill=(18, 22, 26, 255), width=1)
                      d.line((x + 15, y + 3, x + 15, y + 15), fill=(12, 15, 18, 255), width=1)
              for y in (9, 27, 55, 73, 94, 118, 145, 168, 192, 224):
                  d.rectangle((4, y, 245, y + 2), fill=(*glow, 255))
              for x in (18, 48, 82, 116, 150, 184, 218):
                  d.rectangle((x, 2, x + 2, 188), fill=(20, 24, 29, 255))
              d.rectangle((0, 0, 75, 15), fill=(*metal, 255))
              d.rectangle((38, 18, 90, 30), fill=(*glow, 255))
              d.rectangle((52, 112, 112, 125), fill=(30, 53, 65, 255))
              for i in range(24):
                  x = (i * 37 + len(name) * 13) % 246
                  y = (i * 61 + 17) % 190
                  d.line((x, y, x + 7, y + 2), fill=(110, 91, 72, 180), width=1)
              im.save(root / 'entity' / f'{name}.png')

          def core_texture(name, base, glow, metal):
              im = Image.new('RGBA', (16, 16), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.polygon([(8, 0), (14, 4), (14, 11), (8, 15), (2, 11), (2, 4)], fill=(*base, 255), outline=(*metal, 255))
              d.polygon([(8, 3), (11, 5), (11, 10), (8, 12), (5, 10), (5, 5)], fill=(*glow, 255))
              d.rectangle((7, 4, 8, 10), fill=(230, 250, 255, 255))
              im.save(root / 'item' / f'{name}.png')

          for name, (base, glow, metal) in variants.items():
              entity_texture(name, base, glow, metal)
          core_texture('conversion_core', *variants['stratos'])
          core_texture('wraith_core', *variants['wraith'])
          core_texture('vanguard_core', *variants['vanguard'])
          PY

          grep -q 'mod_version=0.5.0' "$ROOT/gradle.properties"
          grep -q 'AegisRadialScreen' "$ROOT/src/client/java/com/noah/aegis7/Aegis7Client.java"
          grep -q 'class RobotChassis' "$ROOT/src/main/java/com/noah/aegis7/state/RobotChassis.java"
          test ! -e "$ROOT/src/client/java/com/noah/aegis7/client/input/SteamDeckGamepadInput.java"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate and compile
        id: compile
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install --quiet pillow
            python verify-project.py
            gradle clean build --stacktrace --warning-mode all
          } 2>&1 | tee ../aegis7-v050-build.log

      - name: Inspect production JAR
        id: inspect
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/aegis7-0.5.0.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -F 'fabric.mod.json'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/Aegis7Mod.class'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/Aegis7Client.class'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/client/gui/AegisRadialScreen.class'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/client/model/AegisModel.class'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/state/RobotChassis.class'
          jar tf "$JAR" | grep -F 'assets/aegis7/textures/entity/stratos.png'
          jar tf "$JAR" | grep -F 'assets/aegis7/textures/entity/wraith.png'
          jar tf "$JAR" | grep -F 'assets/aegis7/textures/entity/vanguard.png'
          if jar tf "$JAR" | grep -q 'SteamDeckGamepadInput.class'; then
            echo 'Legacy direct GLFW controller reader remains in JAR.'
            exit 1
          fi
          unzip -p "$JAR" fabric.mod.json | tee /tmp/aegis7-mod.json
          grep -F '"version": "0.5.0"' /tmp/aegis7-mod.json
          cp "$JAR" ../Aegis-7-Fabric-1.21.1-v0.5.0.jar
          sha256sum ../Aegis-7-Fabric-1.21.1-v0.5.0.jar > ../Aegis-7-Fabric-1.21.1-v0.5.0.jar.sha256

      - name: Headless client resource-load test
        id: client_smoke
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          timeout 180s xvfb-run -a gradle runClient --stacktrace --console=plain > ../aegis7-v050-client.log 2>&1
          STATUS=$?
          set -e
          LOG="run/logs/latest.log"
          test -f "$LOG"
          tail -n 250 "$LOG"
          if grep -Eqi 'Mixin apply for mod aegis7 failed|MixinApplyError.*aegis7|Could not execute entrypoint.*aegis7|Exception in thread "Render thread"|Minecraft has crashed|NoClassDefFoundError.*aegis7' "$LOG"; then
            echo 'Fatal Aegis-7 client startup signature found.'
            exit 1
          fi
          grep -F 'Aegis-7 systems online.' "$LOG"
          grep -E 'Sound engine started|Created: [0-9]+x[0-9]+x[0-9]+ minecraft:textures/atlas' "$LOG"
          if [[ "$STATUS" -ne 0 && "$STATUS" -ne 124 ]]; then
            echo "Unexpected client exit status $STATUS"
            exit 1
          fi

      - name: Dedicated-server startup test
        id: server_smoke
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set +e
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          timeout 120s gradle runServer --stacktrace --console=plain > ../aegis7-v050-server.log 2>&1
          STATUS=$?
          set -e
          LOG="run/logs/latest.log"
          test -f "$LOG"
          tail -n 180 "$LOG"
          if grep -Eqi 'Could not execute entrypoint.*aegis7|Minecraft has crashed|Exception in thread "Server thread"|NoClassDefFoundError.*aegis7' "$LOG"; then
            echo 'Fatal Aegis-7 server startup signature found.'
            exit 1
          fi
          grep -F 'Aegis-7 systems online.' "$LOG"
          grep -E 'Done \([0-9.]+s\)!|For help, type "help"' "$LOG"
          if [[ "$STATUS" -ne 0 && "$STATUS" -ne 124 ]]; then
            echo "Unexpected server exit status $STATUS"
            exit 1
          fi

      - name: Publish build result
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          CLIENT_OUTCOME: ${{ steps.client_smoke.outcome }}
          SERVER_OUTCOME: ${{ steps.server_smoke.outcome }}
        run: |
          set -euo pipefail
          rm -rf release-v050
          mkdir -p release-v050
          printf '%s\n' "$GITHUB_RUN_ID" > release-v050/RUN_ID.txt
          if [[ "$COMPILE_OUTCOME" == "success" && "$INSPECT_OUTCOME" == "success" && "$CLIENT_OUTCOME" == "success" && "$SERVER_OUTCOME" == "success" ]]; then
            cp Aegis-7-Fabric-1.21.1-v0.5.0.jar release-v050/
            cp Aegis-7-Fabric-1.21.1-v0.5.0.jar.sha256 release-v050/
            printf 'Aegis-7 v0.5.0 passed resource validation, Java 21 compilation, Fabric remapping, production-JAR inspection, client resource loading, and dedicated-server startup. Direct Steam Deck polling is absent.\n' > release-v050/BUILD_PASSED.txt
          else
            printf 'Compile: %s\nInspect: %s\nClient: %s\nServer: %s\n' "$COMPILE_OUTCOME" "$INSPECT_OUTCOME" "$CLIENT_OUTCOME" "$SERVER_OUTCOME" > release-v050/BUILD_FAILED.txt
            for log in aegis7-v050-build.log aegis7-v050-client.log aegis7-v050-server.log; do
              if [[ -f "$log" ]]; then
                printf '\n--- %s ---\n' "$log" >> release-v050/BUILD_FAILED.txt
                tail -n 350 "$log" >> release-v050/BUILD_FAILED.txt
              fi
            done
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A release-v050
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Aegis-7 v0.5.0 build result'
            git push origin HEAD:aegis7-build
          fi

      - name: Upload paste-ready release
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-7-Fabric-1.21.1-v0.5.0
          path: |
            Aegis-7-Fabric-1.21.1-v0.5.0.jar
            Aegis-7-Fabric-1.21.1-v0.5.0.jar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Fail workflow if any gate failed
        if: steps.compile.outcome != 'success' || steps.inspect.outcome != 'success' || steps.client_smoke.outcome != 'success' || steps.server_smoke.outcome != 'success'
        shell: bash
        run: exit 1
