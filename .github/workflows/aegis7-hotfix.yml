name: Build and test Aegis-7 renderer hotfix

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, 'build-aegis7-renderer-hotfix')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated Aegis-7 build branch
        uses: actions/checkout@v4
        with:
          ref: aegis7-build

      - name: Reconstruct and patch source package
        shell: bash
        run: |
          set -euo pipefail
          cat aegis7-source.tgz.b64.000 aegis7-source.tgz.b64.001 aegis7-source.tgz.b64.002 aegis7-source.tgz.b64.003 | base64 --decode > /tmp/aegis7-source.tgz
          echo "c793d2ebc9aea5b7cc500cafc69e94f81e5a11f24d9cd5d5fabd04dc09d8a11b  /tmp/aegis7-source.tgz" | sha256sum --check
          tar -xzf /tmp/aegis7-source.tgz
          python3 - <<'PY'
          from pathlib import Path

          root = Path('Aegis7_Transforming_Robot_Mod')
          mixin = root / 'src/client/java/com/noah/aegis7/mixin/client/PlayerEntityRendererMixin.java'
          mixin.write_text('''package com.noah.aegis7.mixin.client;

import com.noah.aegis7.client.state.ClientRobotState;
import net.minecraft.client.MinecraftClient;
import net.minecraft.client.network.AbstractClientPlayerEntity;
import net.minecraft.client.render.entity.PlayerEntityRenderer;
import net.minecraft.client.render.entity.model.PlayerEntityModel;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Inject;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

@Mixin(PlayerEntityRenderer.class)
public abstract class PlayerEntityRendererMixin {
    @Inject(method = "setModelPose", at = @At("TAIL"))
    private void aegis7$setPlayerModelVisibility(AbstractClientPlayerEntity player, CallbackInfo ci) {
        PlayerEntityModel<AbstractClientPlayerEntity> model =
                ((PlayerEntityRenderer) (Object) this).getModel();
        boolean hideLocalPlayer = ClientRobotState.isMorphed()
                && player == MinecraftClient.getInstance().player;
        model.setVisible(!hideLocalPlayer);
    }
}
''', encoding='utf-8')

          state = root / 'src/main/java/com/noah/aegis7/state/RobotStateManager.java'
          text = state.read_text(encoding='utf-8')
          text = text.replace('SoundEvents.ENTITY_GENERIC_EXPLODE,',
                              'SoundEvents.ENTITY_GENERIC_EXPLODE.value(),')
          state.write_text(text, encoding='utf-8')

          props = root / 'gradle.properties'
          text = props.read_text(encoding='utf-8').replace('mod_version=0.3.0', 'mod_version=0.3.1')
          props.write_text(text, encoding='utf-8')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate and compile
        id: compile
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install --quiet pillow
            python verify-project.py
            gradle clean build --stacktrace --warning-mode all
          } 2>&1 | tee ../aegis7-build.log

      - name: Inspect built JAR
        id: inspect
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/aegis7-0.3.1.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -F 'fabric.mod.json'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/Aegis7Mod.class'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/Aegis7Client.class'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/mixin/client/PlayerEntityRendererMixin.class'
          jar tf "$JAR" | grep -F 'assets/aegis7/textures/entity/aegis7.png'
          cp "$JAR" ../Aegis-7-Fabric-1.21.1-v0.3.1.jar
          sha256sum ../Aegis-7-Fabric-1.21.1-v0.3.1.jar > ../Aegis-7-Fabric-1.21.1-v0.3.1.jar.sha256

      - name: Run extended client startup smoke test
        id: smoke
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          set +e
          timeout 70s xvfb-run -a gradle runClient --args='--username AegisHotfixTest' > ../aegis7-client-smoke.log 2>&1
          rc=$?
          set -e
          if [[ "$rc" != "0" && "$rc" != "124" ]]; then
            cat ../aegis7-client-smoke.log
            exit "$rc"
          fi
          grep -F 'Aegis-7 systems online.' ../aegis7-client-smoke.log
          grep -F 'Sound engine started' ../aegis7-client-smoke.log
          if grep -Eqi 'Mixin apply for mod aegis7 failed|PlayerEntityRendererMixin.*InvalidMixin|Game crashed|Aegis-7.*FAILED during APPLY' ../aegis7-client-smoke.log; then
            cat ../aegis7-client-smoke.log
            exit 1
          fi

      - name: Publish result to isolated branch
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          rm -rf release-hotfix
          mkdir -p release-hotfix
          printf '%s\n' "$GITHUB_RUN_ID" > release-hotfix/RUN_ID.txt
          if [[ "$COMPILE_OUTCOME" == "success" && "$INSPECT_OUTCOME" == "success" && "$SMOKE_OUTCOME" == "success" ]]; then
            cp Aegis-7-Fabric-1.21.1-v0.3.1.jar release-hotfix/
            cp Aegis-7-Fabric-1.21.1-v0.3.1.jar.sha256 release-hotfix/
            printf 'Build passed compilation, remapping, JAR inspection, and extended resource-loading client smoke test without the Aegis-7 renderer mixin failure.\n' > release-hotfix/BUILD_PASSED.txt
          else
            printf 'Compile: %s\nInspect: %s\nSmoke: %s\n\n' "$COMPILE_OUTCOME" "$INSPECT_OUTCOME" "$SMOKE_OUTCOME" > release-hotfix/BUILD_FAILED.txt
            [[ -f aegis7-build.log ]] && tail -n 250 aegis7-build.log >> release-hotfix/BUILD_FAILED.txt
            [[ -f aegis7-client-smoke.log ]] && { printf '\n--- client smoke ---\n' >> release-hotfix/BUILD_FAILED.txt; tail -n 350 aegis7-client-smoke.log >> release-hotfix/BUILD_FAILED.txt; }
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A release-hotfix
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Aegis-7 v0.3.1 renderer hotfix result'
            git push origin HEAD:aegis7-build
          fi

      - name: Upload paste-ready hotfix JAR
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success' && steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aegis7-0.3.1-fabric-1.21.1
          path: |
            Aegis-7-Fabric-1.21.1-v0.3.1.jar
            Aegis-7-Fabric-1.21.1-v0.3.1.jar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Fail job when validation failed
        if: steps.compile.outcome != 'success' || steps.inspect.outcome != 'success' || steps.smoke.outcome != 'success'
        shell: bash
        run: exit 1
