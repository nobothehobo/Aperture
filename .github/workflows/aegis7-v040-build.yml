name: Build complete Aegis-7 v0.4.0 release

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, 'build-aegis7-v040-complete')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out isolated Aegis-7 source branch
        uses: actions/checkout@v4
        with:
          ref: aegis7-build

      - name: Reconstruct source and apply complete v0.4.0 corrections
        shell: bash
        run: |
          set -euo pipefail
          cat aegis7-source.tgz.b64.000 aegis7-source.tgz.b64.001 aegis7-source.tgz.b64.002 aegis7-source.tgz.b64.003 | base64 --decode > /tmp/aegis7-source.tgz
          echo "c793d2ebc9aea5b7cc500cafc69e94f81e5a11f24d9cd5d5fabd04dc09d8a11b  /tmp/aegis7-source.tgz" | sha256sum --check
          tar -xzf /tmp/aegis7-source.tgz
          ROOT=Aegis7_Transforming_Robot_Mod

          cat > "$ROOT/src/client/java/com/noah/aegis7/mixin/client/PlayerEntityRendererMixin.java" <<'JAVA'
          package com.noah.aegis7.mixin.client;

          import com.noah.aegis7.client.state.ClientRobotState;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.AbstractClientPlayerEntity;
          import net.minecraft.client.render.entity.PlayerEntityRenderer;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(PlayerEntityRenderer.class)
          public abstract class PlayerEntityRendererMixin {
              @Inject(method = "setModelPose", at = @At("TAIL"))
              private void aegis7$setVanillaModelVisibility(AbstractClientPlayerEntity player, CallbackInfo ci) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  boolean hideLocalPlayer = ClientRobotState.isMorphed() && player == client.player;
                  PlayerEntityRenderer renderer = (PlayerEntityRenderer) (Object) this;
                  renderer.getModel().setVisible(!hideLocalPlayer);
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          root = Path('Aegis7_Transforming_Robot_Mod')

          p = root / 'gradle.properties'
          s = p.read_text()
          s = s.replace('loader_version=0.16.14', 'loader_version=0.19.3')
          s = s.replace('fabric_version=0.115.6+1.21.1', 'fabric_version=0.116.15+1.21.1')
          s = s.replace('mod_version=0.3.0', 'mod_version=0.4.0')
          p.write_text(s)

          p = root / 'src/main/java/com/noah/aegis7/state/RobotStateManager.java'
          s = p.read_text().replace('SoundEvents.ENTITY_GENERIC_EXPLODE,\n', 'SoundEvents.ENTITY_GENERIC_EXPLODE.value(),\n')
          marker = '''    public static void remove(Entity entity) {\n        STATES.remove(entity.getUuid());\n    }\n'''
          replacement = '''    public static void resetAfterRespawn(ServerPlayerEntity oldPlayer, ServerPlayerEntity newPlayer) {\n        STATES.remove(oldPlayer.getUuid());\n        RobotState freshState = get(newPlayer);\n        updateFlight(newPlayer, freshState, false);\n        newPlayer.fallDistance = 0.0F;\n        sync(newPlayer);\n    }\n\n    public static void remove(Entity entity) {\n        STATES.remove(entity.getUuid());\n    }\n'''
          if marker not in s:
              raise SystemExit('RobotStateManager respawn insertion point missing')
          p.write_text(s.replace(marker, replacement))

          p = root / 'src/main/java/com/noah/aegis7/Aegis7Mod.java'
          s = p.read_text()
          s = s.replace('import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;\n',
                        'import net.fabricmc.fabric.api.entity.event.v1.ServerPlayerEvents;\nimport net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;\n')
          marker = '''        ServerPlayConnectionEvents.DISCONNECT.register((handler, server) ->\n                RobotStateManager.remove(handler.player)\n        );\n\n        ServerTickEvents.END_SERVER_TICK.register(RobotStateManager::tick);\n'''
          replacement = '''        ServerPlayConnectionEvents.DISCONNECT.register((handler, server) ->\n                RobotStateManager.remove(handler.player)\n        );\n        ServerPlayerEvents.AFTER_RESPAWN.register((oldPlayer, newPlayer, alive) ->\n                RobotStateManager.resetAfterRespawn(oldPlayer, newPlayer)\n        );\n\n        ServerTickEvents.END_SERVER_TICK.register(RobotStateManager::tick);\n'''
          if marker not in s:
              raise SystemExit('Aegis7Mod respawn insertion point missing')
          p.write_text(s.replace(marker, replacement))

          p = root / 'src/client/java/com/noah/aegis7/Aegis7Client.java'
          s = p.read_text().replace(
              '            if (client.player == null || client.getNetworkHandler() == null || !ClientRobotState.isMorphed()) return;\n',
              '            if (client.player == null || client.getNetworkHandler() == null\n                    || client.currentScreen != null || !ClientRobotState.isMorphed()) return;\n')
          p.write_text(s)
          PY

          grep -q 'mod_version=0.4.0' "$ROOT/gradle.properties"
          grep -q 'renderer.getModel().setVisible(!hideLocalPlayer)' "$ROOT/src/client/java/com/noah/aegis7/mixin/client/PlayerEntityRendererMixin.java"
          grep -q 'ENTITY_GENERIC_EXPLODE.value()' "$ROOT/src/main/java/com/noah/aegis7/state/RobotStateManager.java"
          grep -q 'ServerPlayerEvents.AFTER_RESPAWN' "$ROOT/src/main/java/com/noah/aegis7/Aegis7Mod.java"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate and compile full release
        id: compile
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pip install --quiet pillow
            python verify-project.py
            gradle clean build --stacktrace --warning-mode all
          } 2>&1 | tee ../aegis7-v040-build.log

      - name: Inspect remapped production JAR
        id: inspect
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/aegis7-0.4.0.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -F 'fabric.mod.json'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/Aegis7Mod.class'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/Aegis7Client.class'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/mixin/client/PlayerEntityRendererMixin.class'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/client/model/AegisModel.class'
          jar tf "$JAR" | grep -F 'com/noah/aegis7/client/input/SteamDeckGamepadInput.class'
          jar tf "$JAR" | grep -F 'assets/aegis7/textures/entity/aegis7.png'
          unzip -p "$JAR" fabric.mod.json | tee /tmp/aegis7-fabric-mod.json
          grep -F '"version": "0.4.0"' /tmp/aegis7-fabric-mod.json

          javap -classpath "$JAR" -v com.noah.aegis7.mixin.client.PlayerEntityRendererMixin > /tmp/aegis7-mixin-javap.txt
          if grep -Fq 'org/spongepowered/asm/mixin/Shadow' /tmp/aegis7-mixin-javap.txt; then
            echo 'Invalid inherited Shadow annotation remains in production JAR.'
            exit 1
          fi
          grep -F 'setVanillaModelVisibility' /tmp/aegis7-mixin-javap.txt
          cp "$JAR" ../Aegis-7-Fabric-1.21.1-v0.4.0.jar
          sha256sum ../Aegis-7-Fabric-1.21.1-v0.4.0.jar > ../Aegis-7-Fabric-1.21.1-v0.4.0.jar.sha256

      - name: Headless Minecraft client resource-load test
        id: client_smoke
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          timeout 180s xvfb-run -a gradle runClient --stacktrace --console=plain > ../aegis7-v040-client.log 2>&1
          STATUS=$?
          set -e
          LOG="run/logs/latest.log"
          test -f "$LOG"
          tail -n 250 "$LOG"
          if grep -Eqi 'Mixin apply for mod aegis7 failed|MixinApplyError.*aegis7|Could not execute entrypoint.*aegis7|Exception in thread "Render thread"|Minecraft has crashed|NoClassDefFoundError.*aegis7' "$LOG"; then
            echo 'Fatal Aegis-7 client startup signature found.'
            exit 1
          fi
          grep -F 'Aegis-7 systems online.' "$LOG"
          grep -E 'Sound engine started|Created: [0-9]+x[0-9]+x[0-9]+ minecraft:textures/atlas' "$LOG"
          if [[ "$STATUS" -ne 0 && "$STATUS" -ne 124 ]]; then
            echo "Unexpected client test exit status $STATUS"
            exit 1
          fi

      - name: Headless dedicated-server startup test
        id: server_smoke
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success'
        continue-on-error: true
        working-directory: Aegis7_Transforming_Robot_Mod
        shell: bash
        run: |
          set +e
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          timeout 120s gradle runServer --stacktrace --console=plain > ../aegis7-v040-server.log 2>&1
          STATUS=$?
          set -e
          LOG="run/logs/latest.log"
          test -f "$LOG"
          tail -n 180 "$LOG"
          if grep -Eqi 'Could not execute entrypoint.*aegis7|Minecraft has crashed|Exception in thread "Server thread"|NoClassDefFoundError.*aegis7' "$LOG"; then
            echo 'Fatal Aegis-7 server startup signature found.'
            exit 1
          fi
          grep -F 'Aegis-7 systems online.' "$LOG"
          grep -E 'Done \([0-9.]+s\)!|For help, type "help"' "$LOG"
          if [[ "$STATUS" -ne 0 && "$STATUS" -ne 124 ]]; then
            echo "Unexpected server test exit status $STATUS"
            exit 1
          fi

      - name: Publish complete release result
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          CLIENT_OUTCOME: ${{ steps.client_smoke.outcome }}
          SERVER_OUTCOME: ${{ steps.server_smoke.outcome }}
        run: |
          set -euo pipefail
          rm -rf release-v040
          mkdir -p release-v040
          printf '%s\n' "$GITHUB_RUN_ID" > release-v040/RUN_ID.txt
          if [[ "$COMPILE_OUTCOME" == "success" && "$INSPECT_OUTCOME" == "success" && "$CLIENT_OUTCOME" == "success" && "$SERVER_OUTCOME" == "success" ]]; then
            cp Aegis-7-Fabric-1.21.1-v0.4.0.jar release-v040/
            cp Aegis-7-Fabric-1.21.1-v0.4.0.jar.sha256 release-v040/
            printf 'Aegis-7 v0.4.0 passed source/resource validation, Java 21 compilation, Fabric production remapping, remapped-mixin inspection, client resource loading, and dedicated-server startup.\n' > release-v040/BUILD_PASSED.txt
          else
            printf 'Compile: %s\nInspect: %s\nClient: %s\nServer: %s\n' "$COMPILE_OUTCOME" "$INSPECT_OUTCOME" "$CLIENT_OUTCOME" "$SERVER_OUTCOME" > release-v040/BUILD_FAILED.txt
            for log in aegis7-v040-build.log aegis7-v040-client.log aegis7-v040-server.log; do
              if [[ -f "$log" ]]; then
                printf '\n--- %s ---\n' "$log" >> release-v040/BUILD_FAILED.txt
                tail -n 300 "$log" >> release-v040/BUILD_FAILED.txt
              fi
            done
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A release-v040
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete Aegis-7 v0.4.0 build result'
            git push origin HEAD:aegis7-build
          fi

      - name: Upload complete paste-ready release
        if: steps.compile.outcome == 'success' && steps.inspect.outcome == 'success' && steps.client_smoke.outcome == 'success' && steps.server_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-7-Fabric-1.21.1-v0.4.0-complete
          path: |
            Aegis-7-Fabric-1.21.1-v0.4.0.jar
            Aegis-7-Fabric-1.21.1-v0.4.0.jar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Fail workflow if any release gate failed
        if: steps.compile.outcome != 'success' || steps.inspect.outcome != 'success' || steps.client_smoke.outcome != 'success' || steps.server_smoke.outcome != 'success'
        shell: bash
        run: exit 1
